name: Generate IRR Prefixes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

env:
  ASN_LOCAL: "150289"
  AS_SET: "AS-SUNYZ"
  OUTPUT: "irr.conf"
  WHOIS_SERVER: "rr.ntt.net"
  IRR_SOURCES: "ARIN,APNIC,RIPE,AFRINIC,LACNIC,RADB,ALTDB"

jobs:
  generate:
    name: Generate IRR.conf
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.commit.outputs.changes }}
      msg: ${{ steps.commit.outputs.msg }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Install bgpq4
        id: install
        run: |
          sudo apt-get update
          sudo apt-get install -y bgpq4

      - name: Grant Permissions
        id: permit
        run: chmod +x bgpq4/generate-irr.sh

      - name: Generate IRR Prefixes
        id: generate
        run: bash bgpq4/generate-irr.sh

      - name: Commit and Push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n "$(git status --porcelain -- "$OUTPUT")" ]]; then
            git add "$OUTPUT"
            COMMIT_MSG="Update IRR Data ($(date -u '+%Y-%m-%d %H:%M:%S') UTC)"
            git commit -m "$COMMIT_MSG"
            git push
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "msg=$COMMIT_MSG" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

  verify-and-push:
    name: Verify Config and Push
    runs-on: ubuntu-24.04
    needs: generate
    if: needs.generate.outputs.changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "main"
          fetch-depth: 0

      - name: Install BIRD2 (CZ.NIC)
        id: install
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get -y install apt-transport-https ca-certificates wget gnupg git
          sudo wget -O /usr/share/keyrings/cznic-labs-pkg.gpg https://pkg.labs.nic.cz/gpg
          echo "deb [signed-by=/usr/share/keyrings/cznic-labs-pkg.gpg] https://pkg.labs.nic.cz/bird2 noble main" | sudo tee /etc/apt/sources.list.d/cznic-labs-bird2.list 
          sudo apt-get update
          sudo apt-get -y install bird2

      - name: Copy Files to /etc/bird
        id: copy
        run: |
          set -euxo pipefail
          test -f bird.conf || { echo "❌ bird.conf Not Found."; exit 1; }
          sudo mkdir -p /etc/bird
          sudo find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -a {} /etc/bird/ \;
          sudo chown -R root:root /etc/bird

      - name: Verify BIRD configuration
        id: verify
        run: |
          set -euxo pipefail
          SOCK="/run/bird-test.ctl"
          PID="/run/bird-test.pid"
          sudo /usr/sbin/bird -c /etc/bird/bird.conf -s "$SOCK" -P "$PID" || true
          for i in $(seq 1 10); do
            [ -S "$SOCK" ] && break
            sleep 0.5
          done
          set +e
          OUT="$(sudo /usr/sbin/birdc -s "$SOCK" configure check 2>&1 || true)"
          set -e
          echo "----- BIRD Configure Check Output Start -----"
          echo "$OUT"
          echo "----- BIRD Configure Check Output End -----"
          if [ -f "$PID" ]; then
            sudo kill "$(cat "$PID")" 2>/dev/null || true
          fi
          if echo "$OUT" | grep -q "Configuration OK"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Stop if Configuration Failed
        if: steps.verify.outputs.ok != 'true'
        run: |
          echo "❌ Failed to Configure BIRD2."
          exit 1

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage Files
        id: stage
        if: steps.verify.outputs.ok == 'true'
        run: |
          set -euxo pipefail
          STAGE_DIR="$(mktemp -d)"
          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'bgpq4' \
            ! -name 'bird.conf' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            -exec cp -a {} "$STAGE_DIR"/ \;

      - name: Prepare prod Branch
        id: prep
        run: |
          set -euxo pipefail
          git fetch origin
          if git ls-remote --exit-code --heads origin prod >/dev/null 2>&1; then
            git checkout -B prod origin/prod
            echo "has_prod=true" >> "$GITHUB_OUTPUT"
          else
            git checkout --orphan prod
            git rm -rf .
            echo "has_prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Populate prod from Staged Files
        id: populate
        run: |
          set -euxo pipefail
          STAGE_DIR="${{ steps.stage.outputs.stage_dir }}"
          cp -a "$STAGE_DIR"/. .
          git add -A

      - name: Commit and Push
        id: push
        env:
          PREV_COMMIT_MSG: ${{ needs.generate.outputs.msg }}
        run: |
          set -euxo pipefail
          if git diff --cached --quiet; then
            echo "⚠️ No Changes to Commit."
          else
            git commit -m "Verified: $PREV_COMMIT_MSG"
            if [ "${{ steps.prep.outputs.has_prod }}" = "true" ]; then
              git push --force-with-lease origin prod
            else
              git push -u origin prod
          fi
