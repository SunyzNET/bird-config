name: Verify Configuration

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Generate IRR Prefixes
    types:
      - completed

permissions:
  contents: write

jobs:
  changes:
    name: Check Code Changes
    runs-on: ubuntu-latest
    outputs:
      root: ${{ steps.filter.outputs.root }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            root:
              - './irr.conf'

  verify-and-push:
    name: Verify Config and Push
    runs-on: ubuntu-24.04
    needs:
      - changes
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && needs.changes.outputs.root == 'true'
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || 'main' }}
          fetch-depth: 0

      - name: Install BIRD2 (CZ.NIC)
        id: install
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get -y install apt-transport-https ca-certificates wget gnupg git
          sudo wget -O /usr/share/keyrings/cznic-labs-pkg.gpg https://pkg.labs.nic.cz/gpg
          echo "deb [signed-by=/usr/share/keyrings/cznic-labs-pkg.gpg] https://pkg.labs.nic.cz/bird2 noble main" | sudo tee /etc/apt/sources.list.d/cznic-labs-bird2.list
          sudo apt-get update
          sudo apt-get -y install bird2

      - name: Copy Files to /etc/bird
        id: copy
        run: |
          set -euxo pipefail
          test -f bird.conf || { echo "❌ bird.conf Not Found."; exit 1; }
          sudo mkdir -p /etc/bird
          sudo find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -a {} /etc/bird/ \;
          sudo chown -R root:root /etc/bird

      - name: Verify BIRD configuration
        id: verify
        run: |
          set -euxo pipefail
          SOCK="/run/bird-test.ctl"
          PID="/run/bird-test.pid"
          sudo /usr/sbin/bird -c /etc/bird/bird.conf -s "$SOCK" -P "$PID" || true
          for i in $(seq 1 10); do
            [ -S "$SOCK" ] && break
            sleep 0.5
          done
          set +e
          OUT="$(sudo /usr/sbin/birdc -s "$SOCK" configure check 2>&1 || true)"
          set -e
          echo "----- BIRD Configure Check Output Start -----"
          echo "$OUT"
          echo "----- BIRD Configure Check Output End -----"
          if [ -f "$PID" ]; then
            sudo kill "$(cat "$PID")" 2>/dev/null || true
          fi
          if echo "$OUT" | grep -q "Configuration OK"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if Configuration Failed
        if: steps.verify.outputs.ok != 'true'
        run: |
          echo "❌ Failed to Configure BIRD2."
          exit 1

      - name: Configure Git Identity
        if: steps.verify.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage Files
        id: stage
        if: steps.verify.outputs.ok == 'true'
        run: |
          set -euxo pipefail
          STAGE_DIR="$(mktemp -d)"
          echo "stage_dir=$STAGE_DIR" >> "$GITHUB_OUTPUT"
          TMP_LIST="$(mktemp)"
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'bgpq4' \
            ! -name 'bird.conf' \
            ! -name 'README.md' \
            ! -name 'LICENSE' \
            -print0 > "$TMP_LIST"
          while IFS= read -r -d '' p; do
            cp -a "$p" "$STAGE_DIR"/
          done < "$TMP_LIST"

      - name: Prepare prod Branch
        id: prep
        if: steps.verify.outputs.ok == 'true'
        run: |
          set -euxo pipefail
          git fetch origin
          if git ls-remote --exit-code --heads origin prod >/dev/null 2>&1; then
            git checkout -B prod origin/prod
            git pull --ff-only origin prod
            echo "has_prod=true" >> "$GITHUB_OUTPUT"
          else
            git checkout --orphan prod
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            echo "has_prod=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Populate prod from Staged Files (no rsync, root)
        id: populate
        if: steps.verify.outputs.ok == 'true'
        run: |
          set -euxo pipefail
          STAGE_DIR="${{ steps.stage.outputs.stage_dir }}"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$STAGE_DIR"/. .
          git add -A

      - name: Commit and Push
        id: push
        if: steps.verify.outputs.ok == 'true'
        run: |
          set -euxo pipefail
          if git diff --cached --quiet; then
            echo "⚠️ No Changes to Commit."
          else
            git commit -m "Verify Configuration ($(date -u '+%Y-%m-%d %H:%M:%S') UTC)"
            if [ "${{ steps.prep.outputs.has_prod }}" = "true" ]; then
              git push --force-with-lease origin prod
            else
              git push -u origin prod
            fi
          fi
