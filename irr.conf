function downstream_import_filter(int ASN) -> bool {
	if is_invalid() then return false;
	lc_add_in(ASN, 2);
	if !(ASN ~ ASN_DOWNSTREAM) then return false;

	case net.type {
		NET_IP4: {
			if (ASN = 211575) then return net ~ DOWNSTREAM_PREFIXES_AS211575_IPV4;
			if (ASN = 213605) then return net ~ DOWNSTREAM_PREFIXES_AS213605_IPV4;
			if (ASN = 214933) then return net ~ DOWNSTREAM_PREFIXES_AS214933_IPV4;
			return false;
		}
		NET_IP6: {
			if (ASN = 211575) then return net ~ DOWNSTREAM_PREFIXES_AS211575_IPV6;
			if (ASN = 213605) then return net ~ DOWNSTREAM_PREFIXES_AS213605_IPV6;
			if (ASN = 214933) then return net ~ DOWNSTREAM_PREFIXES_AS214933_IPV6;
			return false;
		}
		else: {
			print "downstream_import_filter: unexpected net.type ", net.type, " ", net;
			return false;
		}
	}
}
